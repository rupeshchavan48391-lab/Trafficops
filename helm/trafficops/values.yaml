replicaCount:
  api: 1
  processor: 1
  simulator: 1
  postgres: 1
  rabbitmq: 1

image:
  repository: trafficops
  tag: latest
  pullPolicy: IfNotPresent

api:
  service:
    type: ClusterIP
    port: 8000

postgres:
  image: postgres:18
  service:
    port: 5432

rabbitmq:
  image: rabbitmq:4-management
  service:
    amqpPort: 5672
    managementPort: 15672

config:
  dbHost: postgres
  dbPort: "5432"
  dbName: trafficops
  rabbitmqHost: rabbitmq
  rabbitmqPort: "5672"
  rabbitmqQueue: traffic_events

secret:
  dbUser: admin
  dbPassword: admin
  rabbitmqUser: trafficops
  rabbitmqPassword: trafficops
