apiVersion: apps/v1
kind: Deployment

metadata:
  name: trafficops-event-processor
  labels:
    app: trafficops-event-processor

spec:
  replicas: {{ .Values.replicaCount.processor }}

  selector:
    matchLabels:
      app: trafficops-event-processor

  template:
    metadata:
      labels:
        app: trafficops-event-processor

    spec:
      containers:
        - name: event-processor

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            - name: DB_HOST
              value: {{ .Values.config.dbHost | quote }}

            - name: DB_PORT
              value: {{ .Values.config.dbPort | quote }}

            - name: DB_NAME
              value: {{ .Values.config.dbName | quote }}

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: trafficops-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trafficops-secret
                  key: DB_PASSWORD

            - name: RABBITMQ_HOST
              value: {{ .Values.config.rabbitmqHost | quote }}

            - name: RABBITMQ_PORT
              value: {{ .Values.config.rabbitmqPort | quote }}

            - name: RABBITMQ_QUEUE
              value: {{ .Values.config.rabbitmqQueue | quote }}

            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: trafficops-secret
                  key: RABBITMQ_USER

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trafficops-secret
                  key: RABBITMQ_PASSWORD

          command:
            - python
            - -m
            - src.event_processor.main
