apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  labels:
    app: postgres

spec:
  replicas: {{ .Values.replicaCount.postgres }}

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres

          image: {{ .Values.postgres.image }}

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: {{ .Values.config.dbName | quote }}

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: trafficops-secret
                  key: DB_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trafficops-secret
                  key: DB_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql

      volumes:
        - name: postgres-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service

metadata:
  name: postgres
  labels:
    app: postgres

spec:
  type: ClusterIP

  selector:
    app: postgres

  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: 5432
      protocol: TCP
