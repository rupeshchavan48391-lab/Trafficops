apiVersion: apps/v1
kind: Deployment

metadata:
  name: rabbitmq
  labels:
    app: rabbitmq

spec:
  replicas: {{ .Values.replicaCount.rabbitmq }}

  selector:
    matchLabels:
      app: rabbitmq

  template:
    metadata:
      labels:
        app: rabbitmq

    spec:
      containers:
        - name: rabbitmq

          image: {{ .Values.rabbitmq.image }}

          ports:
            - name: amqp
              containerPort: 5672

            - name: management
              containerPort: 15672

          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: trafficops-secret
                  key: RABBITMQ_USER

            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: trafficops-secret
                  key: RABBITMQ_PASSWORD

---
apiVersion: v1
kind: Service

metadata:
  name: rabbitmq
  labels:
    app: rabbitmq

spec:
  type: ClusterIP

  selector:
    app: rabbitmq

  ports:
    - name: amqp
      port: {{ .Values.rabbitmq.service.amqpPort }}
      targetPort: 5672
      protocol: TCP

    - name: management
      port: {{ .Values.rabbitmq.service.managementPort }}
      targetPort: 15672
      protocol: TCP
